<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Pixel English Battle</title>

<style>
/* ===============================
   GLOBAL
=============================== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: linear-gradient(135deg, #C5DFF0 0%, #E8E0D0 50%, #D5E5D0 100%);
  color: #3a3a3a;
  overflow-x: hidden;
  font-family: 'Press Start 2P', monospace;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}

/* Use border-box sizing to make widths predictable and avoid overflow */
html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }

/* ===============================
   BACKGROUND
=============================== */
canvas#fog {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.eclipse {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 64px;
  height: 64px;
  border-radius: 0;
  transform: translate(-50%, -50%);
  background: #E0D5C8;
  box-shadow: 0 0 0 4px #D0C5B8, 0 0 0 8px #E0D5C8, 0 0 0 12px #D0C5B8;
  animation: pixelPulse 1s infinite;
  z-index: 3;
}

.eclipse::before {
  display: none;
}

.vignette {
  position: fixed;
  inset: 0;
  background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(197,223,240,0.05) 100%);
  z-index: 5;
  pointer-events: none;
}

@keyframes eclipsePulse {
  0%,100% { box-shadow: 0 0 0 4px #FFA500, 0 0 0 8px #FFD700, 0 0 0 12px #FFA500; }
  50% { box-shadow: 0 0 0 6px #FFA500, 0 0 0 10px #FFD700, 0 0 0 14px #FFA500; }
}
@keyframes spin { from {transform:rotate(0);} to {transform:rotate(360deg);} }
@keyframes rainbowRotate { from {filter: hue-rotate(0deg);} to {filter: hue-rotate(360deg);} }
@keyframes pixelPulse { 0%,100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } }

/* ===============================
   UI LAYER
=============================== */
#lobby-wrap, #game-ui {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
}

/* ===============================
   CARDS
=============================== */
.card {
  background: linear-gradient(135deg, #F5F8FB 0%, #F5F2ED 100%);
  border-radius: 0;
  padding: 16px;
  box-shadow: 4px 4px 0 #D5E0EE, 8px 8px 0 #C5D5E8;
  border: 4px solid #B5CBDD;
}

.card-title {
  font-size: 1.2em;
  font-weight: normal;
  color: #A08090;
  text-shadow: 2px 2px 0 #D0C5B8;
}

/* ===============================
   BUTTONS
=============================== */
.btn {
  padding: 8px 16px;
  border-radius: 0;
  background: #B5CBDD;
  color: #3a3a3a;
  border: 4px solid #A5BBCD;
  cursor: pointer;
  font-weight: normal;
  transition: none;
  position: relative;
  box-shadow: 4px 4px 0 #A5BBCD;
  font-size: 0.8em;
}

.btn:hover {
  background: #A5BBCD;
  box-shadow: 2px 2px 0 #A5BBCD;
  transform: translate(2px, 2px);
}

.btn:active {
  box-shadow: 0 0 0 #2980b9;
  transform: translate(4px, 4px);
}

.btn-main {
  background: #D0B5C0;
  border: 4px solid #C0A5B0;
  box-shadow: 4px 4px 0 #C0A5B0;
}

.btn-main:hover {
  background: #C0A5B0;
  box-shadow: 2px 2px 0 #C0A5B0;
  transform: translate(2px, 2px);
}

/* ===============================
   GAME UI
=============================== */
#game-ui {
  display: none;
  padding: 20px;
  width: 100%;
  max-width: 1100px;
}

.top-bar {
  display: flex;
  gap: 20px;
  align-items: center;
}

.hp-box {
  flex: 1;
}

.hp-label {
  font-size: 12px;
  opacity: 0.8;
}

.hp-bar {
  width: 100%;
  height: 16px;
  background: #E5EFF5;
  border-radius: 0;
  overflow: hidden;
  margin-top: 4px;
  border: 2px solid #D5E5ED;
  box-shadow: inset 2px 2px 0 #F0F5FA;
  position: relative;
}

.hp-bar .fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #A8D5A8, #95C895, #A8D5A8);
  background-size: 200% 100%;
  animation: hpFlow 2s linear infinite;
  position: relative;
  transition: width 0.3s ease;
}

.hp-bar .fill::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: hpShine 3s ease-in-out infinite;
}

.hp-bar .fill::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,0.1) 2px,
    rgba(255,255,255,0.1) 4px
  );
  animation: hpStripes 1s linear infinite;
}

@keyframes hpStripes {
  0% { transform: translateX(-4px); }
  100% { transform: translateX(4px); }
}

.hp-bar.low-hp .fill {
  background: linear-gradient(90deg, #D0B5C0, #C0A5B0, #D0B5C0);
  animation: hpFlow 1s linear infinite, hpPulse 0.5s ease-in-out infinite alternate;
}

@keyframes hpFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 200% 50%; }
}

@keyframes hpShine {
  0%, 100% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
}

@keyframes hpPulse {
  0% { opacity: 1; }
  100% { opacity: 0.7; }
}

.score-box {
  min-width: 140px;
  text-align: right;
}

/* ===============================
   QUESTION AREA
=============================== */
#question-area {
  margin-top: 24px;
}

#question-text {
  background: linear-gradient(135deg, #FDFAF5 0%, #FFFBF8 100%);
  padding: 12px;
  border-radius: 0;
  font-size: 0.9em;
  margin-bottom: 14px;
  animation: questionFadeIn 0.5s ease-out;
  color: #3a3a3a;
  border: 2px solid #E8E0D0;
  box-shadow: 4px 4px 0 #D8D0C8;
}

@keyframes questionFadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Accessibility & polished focus */
:root{
  --ui-transition: 240ms;
  --accent: #A8D5A8;
  --accent-2: #E8E0D0;
}
.btn:focus, .choice-btn:focus, .mode-card:focus { outline: none; box-shadow: 0 0 0 4px rgba(168,213,168,0.08); border-color: rgba(168,213,168,0.12); }
.btn:focus-visible, .choice-btn:focus-visible { box-shadow: 0 0 0 6px rgba(168,213,168,0.1); }

/* Page transitions */
.fade { transition: opacity var(--ui-transition) ease, transform var(--ui-transition) ease; }
.fade-in { opacity: 1; transform: none; pointer-events: auto; }
.fade-out { opacity: 0; transform: translateY(6px); pointer-events: none; }

/* Reduced motion respect */
@media (prefers-reduced-motion: reduce) {
  .fade, .eclipse::before { transition: none !important; animation: none !important; }
}

#choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 14px;
}

@media (max-width: 600px) {
  #choices {
    grid-template-columns: 1fr;
  }
}

.choice-btn {
  background: #E5EFF5;
  border-radius: 0;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: none;
  position: relative;
  color: #3a3a3a;
  border: 2px solid #D5E5ED;
  box-shadow: 2px 2px 0 #D5E5ED;
  font-size: 0.7em;
}

.choice-btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.3s, height 0.3s;
}

.choice-btn:active::before {
  width: 300px;
  height: 300px;
}

.choice-btn:hover {
  background: #D5E5ED;
  box-shadow: 1px 1px 0 #D5E5ED;
  transform: translate(1px, 1px);
}

.choice-btn.correct {
  background: #C8E5C8;
  border: 2px solid #A8D5A8;
  box-shadow: 2px 2px 0 #A8D5A8;
  animation: pixelCorrect 0.3s ease-out;
}

.choice-btn.incorrect {
  background: #E8D5D5;
  border: 2px solid #D0B5C0;
  box-shadow: 2px 2px 0 #D0B5C0;
  animation: pixelShake 0.3s ease-out;
}

@keyframes pixelCorrect {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes pixelShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  75% { transform: translateX(2px); }
}

/* ===============================
   LOBBY
=============================== */
.lobby-grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 1000px;
}

.mode-card {
  flex: 1 1 420px;
  min-width: 320px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

.mode-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 24px 50px rgba(0,0,0,0.8);
}
/* ===============================
   NIGHTMARE UI (centered)
================================ */
#game-ui.centered-ui {
  position: fixed !important;
  left: 50% !important;
  top: 50% !important;
  transform: translate(-50%, -50%) !important;
  width: min(920px, 94vw) !important;
  padding: 28px !important;
  border-radius: 14px !important;
  background: linear-gradient(180deg, rgba(245,248,251,0.97), rgba(245,242,237,0.97));
  border: 1px solid rgba(181,203,221,0.3) !important;
  box-shadow: 0 30px 80px rgba(0,0,0,0.05), inset 0 0 60px rgba(168,213,168,0.02) !important;
  backdrop-filter: blur(6px) saturate(1.02) !important;
  z-index: 30 !important;
  color: #3a3a3a !important;
}

#game-ui .hp-bar { background: linear-gradient(180deg, rgba(229,239,245,0.5), rgba(213,229,237,0.5)); border-radius:10px; border:1px solid rgba(181,203,221,0.15); }
#game-ui .hp-bar-fill { background: linear-gradient(90deg,#A8D5A8 0%, #95C895 100%); box-shadow: 0 4px 18px rgba(168,213,168,0.08) inset; height:100%; transition:width 220ms ease; }
#game-ui .hp-bar-text { font-weight:700; font-size:0.85rem; margin-left:8px; color:#3a3a3a; }

#game-ui #question-text { font-size:1.28rem; font-weight:800; color:#A08090; letter-spacing:0.02em; text-shadow: 0 2px 10px rgba(232,224,208,0.15); }
#game-ui #answerButtons button, #game-ui .choice-btn { background: linear-gradient(90deg,#E5EFF5 0%, #D5E5ED 100%); color:#3a3a3a; border:1px solid rgba(181,203,221,0.25); box-shadow:0 6px 18px rgba(181,203,221,0.1); padding:10px 14px; border-radius:10px; }
#game-ui #answerButtons button:hover, #game-ui .choice-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow:0 10px 28px rgba(181,203,221,0.15); }

#game-ui .btn { background: linear-gradient(90deg,#B5CBDD 0%, #D5E5ED 100%); border:1px solid rgba(181,203,221,0.25); color:#3a3a3a; }
#game-ui .btn:hover { transform: translateY(-2px); }

@keyframes nightmarePulse { 0% { box-shadow:none; } 50% { box-shadow:0 0 30px rgba(168,213,168,0.05); } 100% { box-shadow:none; } }
#game-ui .hp-bar-fill.low-hp { animation: nightmarePulse 1.6s infinite; }

@media (max-width:600px) { #game-ui.centered-ui { width:96vw; padding:16px; } #game-ui #question-text { font-size:1.05rem; } }

/* ===============================
   HARDCORE / GLITCH VISUALS
================================ */
.scanlines{
  position:fixed; inset:0; z-index:28; pointer-events:none;
  background-image: linear-gradient(rgba(181,203,221,0.002) 1px, transparent 1px);
  background-size: 100% 4px; mix-blend-mode:overlay; opacity:0.1;
}

.card{
  border:1px solid rgba(181,203,221,0.12);
  box-shadow: 0 30px 60px rgba(0,0,0,0.03), inset 0 0 80px rgba(168,213,168,0.005);
  transform: skewY(-0.35deg);
}

.mode-card{
  background: linear-gradient(180deg, rgba(245,248,251,0.9), rgba(245,242,237,0.9));
  border-left: 6px solid rgba(181,203,221,0.45);
}

.card-title{
  position:relative; color:#A08090; letter-spacing:0.02em;
  text-shadow: 0 2px 18px rgba(224,213,200,0.15);
}

@keyframes glitchShift{
  0%{ transform:translateX(0); }
  20%{ transform:translateX(-6px); }
  40%{ transform:translateX(4px); }
  60%{ transform:translateX(-3px); }
  80%{ transform:translateX(2px); }
 100%{ transform:translateX(0); }
}
.card-title{ animation: glitchShift 3.6s infinite; }

.btn-main{ box-shadow: 0 8px 30px rgba(208,181,192,0.08); border:1px solid rgba(192,165,176,0.2); }

#game-ui.centered-ui{ border: 2px solid rgba(181,203,221,0.15); }
#game-ui.centered-ui::after{
  content: '';
  position: absolute; inset: -2px; pointer-events: none; border-radius: 16px;
  box-shadow: 0 0 60px rgba(168,213,168,0.03) inset;
  mix-blend-mode: screen;
}

#game-ui .hp-bar-fill{ box-shadow: 0 8px 28px rgba(168,213,168,0.08) inset; }

.hp-bar-fill.low-hp{ animation: nightmarePulse 1.2s infinite, lowFlash 0.9s infinite; }
@keyframes lowFlash{ 0%{filter:brightness(1);}50%{filter:brightness(1.15) saturate(1.02);}100%{filter:brightness(1);} }

#question-text{ text-transform:uppercase; letter-spacing:0.04em; }

.glitch-text{ position:relative; }
.glitch-text::before, .glitch-text::after{
  content: attr(data-text);
  position:absolute; left:0; top:0; width:100%; color:#fff; opacity:0.06;
}

.mode-card:hover{ transform: translateY(-8px) skewY(-0.2deg) scale(1.02); box-shadow: 0 40px 90px rgba(0,0,0,0.9); }

.mode-card:hover{ transform: translateY(-8px) skewY(-0.2deg) scale(1.02); box-shadow: 0 40px 90px rgba(0,0,0,0.9); }

/* Boss top bar */
#boss-top-bar{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:60; width:min(92%,1100px); display:none; }
/* Phase tick markers — show vertical ticks on the boss HP bar indicating thresholds
  where the next phase will begin (75%, 50%, 25%). */
#boss-top-bar .phase-ticks{ position:absolute; inset:0; z-index:3; pointer-events:none; }
#boss-top-bar .phase-ticks .tick{ position:absolute; top:-6px; bottom:-6px; width:2px; background:rgba(255,255,255,0.08); transform:translateX(-50%); transition:background 200ms, box-shadow 200ms, height 220ms; }
#boss-top-bar .phase-ticks .tick.passed{ background:var(--accent); box-shadow:0 0 12px rgba(168,213,168,0.2); height:120%; top:-12px; }
#boss-top-bar .hp-bar{ background: linear-gradient(180deg, rgba(229,239,245,0.4), rgba(213,229,237,0.4)); border-radius:10px; border:1px solid rgba(181,203,221,0.12); position:relative; }
#boss-top-bar .hp-bar-fill{ background: linear-gradient(90deg,#A8D5A8 0%, #95C895 100%); height:100%; transition:width 260ms ease; box-shadow:0 6px 24px rgba(168,213,168,0.06) inset; }
#boss-top-bar .hp-bar-text{ font-weight:800; color:#3a3a3a; font-size:0.9rem; margin-left:8px; }

/* ===============================
   RESPONSIVE ADJUSTMENTS
   Improve layout and touch targets for tablets/phones
================================ */
@media (max-width:900px) {
  .eclipse { width:260px; height:260px; }
  .card { padding:16px; }
  .card-title { font-size:1.2em; }
  #game-ui { max-width:96vw; padding:16px; }
  .lobby-grid { gap:14px; }
  .hp-box { min-width:120px; }
}

@media (max-width:600px) {
  /* allow vertical scrolling on small devices and respect safe-area; keep horizontal locked */
  html, body { overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
  canvas#fog, .scanlines { display: none; }
  .eclipse { width:160px; height:160px; }
  .vignette { opacity:0.92; }

  /* transform centered UI into a natural flow card so it doesn't block the viewport */
  #game-ui.centered-ui {
    position: relative !important;
    left: auto !important;
    top: auto !important;
    transform: none !important;
    width: 96vw !important;
    margin: 14px auto !important;
    padding: 14px !important;
    border-radius: 12px !important;
  }

  /* stack top-bar elements vertically for narrow widths */
  .top-bar { flex-direction: column; align-items: stretch; gap:12px; }
  .top-bar .hp-box, .top-bar .score-box { width:100%; }

  #game-ui { padding:12px; }
  #question-text { font-size:1rem; }

  /* answers: column, full width, large touch targets */
  #answerButtons, #choices { display:flex; flex-direction:column; gap:12px; }
  #answerButtons button, .choice-btn, .btn { width:100%; min-height:52px; font-size:1.04rem; border-radius:12px; padding:12px 14px; }

  /* lobby: stack cards and make primary actions prominent */
  .lobby-grid { flex-direction:column; align-items:stretch; padding:12px; }
  .mode-card { min-width:unset; width:100%; }
  #boss-mode-btn { width:100%; font-size:1.05rem; padding:12px 14px; }

  /* ensure battle container wraps instead of forcing horizontal scroll */
  #battle-container { flex-wrap: wrap; gap:10px; }
  .character img { max-width:100%; height:auto; display:block; }

  /* ensure cards never exceed viewport width */
  .card { max-width: 100%; overflow: hidden; }

  /* reduce or hide decorative characters on very small screens */
  @media (max-width:420px) {
    .character img { display:none; }
    .eclipse { width:140px; height:140px; }
    #question-text { font-size:0.95rem; }
    #answerButtons button, .choice-btn, .btn { min-height:56px; font-size:1rem; }
  }

  /* boss top bar should not cover content on small screens */
  #boss-top-bar { top:8px; left:50%; transform:translateX(-50%); }

  /* make action buttons sticky at bottom on narrow screens (if visible) */
  #action-buttons { position: sticky; bottom: 8px; left: 0; display:flex; gap:8px; justify-content:center; padding:6px 12px; background:transparent; }
}

</style>
</head>

<body>

<canvas id="fog"></canvas>
<canvas id="particles" style="position: fixed; inset: 0; z-index: 2; pointer-events: none;"></canvas>
<div class="eclipse"></div>
<div class="vignette"></div>
<div class="scanlines"></div>
<!-- MAIN MENU -->
<div id="main-menu" style="position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;">
  <div class="card" style="padding:28px; text-align:center; max-width:520px;">
    <div class="card-title" style="font-size:1.4em; margin-bottom:12px;">Pixel English Battle</div>
    <div style="margin-bottom:18px; color:#3a3a3a;">Welcome! เลือกเริ่มเกมหรือดูคะแนนผู้เล่น</div>
    <div style="display:flex; gap:12px; justify-content:center;">
      <button id="menu-start-btn" class="btn btn-main" style="min-width:140px;">Start</button>
      <button id="menu-score-btn" class="btn" style="min-width:140px;">Player Score</button>
    </div>
  </div>
</div>
<!-- Large Boss HP bar (visible in Boss Mode) -->
<div id="boss-top-bar" style="display:none;" data-phase="0">
  <div class="card" style="padding:10px 14px; max-width:1100px; margin:0 auto; background: linear-gradient(90deg, rgba(245,248,251,0.93), rgba(245,242,237,0.93)); border-radius:12px; position:relative;">
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="font-weight:900; color:#ffb3b3; min-width:56px;">BOSS</div>
      <div style="flex:1; position:relative;">
        <div class="hp-bar" data-max="37000" style="height:22px;">
          <div class="phase-ticks" aria-hidden="true"></div>
          <div class="hp-bar-fill" style="width:100%"></div>
          <div class="hp-bar-text">37000 / 37000</div>
        </div>
      </div>
        <div style="min-width:200px; text-align:right; color:#3a3a3a; font-weight:700; display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
        <div>Phase: <span id="boss-phase-top">1/4</span></div>
      </div>
    </div>
  </div>
</div>

<!-- ===============================
     HIGH SCORE PAGE
=============================== -->
<div id="high-score-page" style="display:none; position:fixed; right:0; top:0; width:350px; height:100%; z-index:15; background: linear-gradient(180deg, #F5F8FB 0%, #F5F2ED 100%); overflow-y:auto;">
  <div class="card" style="margin:20px; padding:20px; width:calc(100% - 40px);">
    <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">🏆 High Scores <button id="close-high-score-btn" class="btn" style="font-size:12px; padding:5px 10px;">✕</button></div>
    
    <!-- Mode Selection -->
    <div id="hs-mode-select" style="margin-top:20px;">
      <h3 style="color:#3a3a3a; margin-bottom:10px;">เลือกโหมด</h3>
      <button id="hs-original-btn" class="btn" style="margin-right:10px;">Original Mode</button>
      <button id="hs-boss-btn" class="btn">Boss Mode</button>
    </div>
    
    <!-- Difficulty Selection for Original -->
    <div id="hs-difficulty-select" style="display:none; margin-top:20px;">
      <h3 style="color:#3a3a3a; margin-bottom:10px;">เลือกความยาก</h3>
      <button class="btn hs-diff-btn" data-diff="Easy" style="margin-right:10px;">Easy</button>

<!-- ===============================
     BACKGROUND SCRIPT
=============================== -->
<script>
const canvas = document.getElementById("fog");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resize(); addEventListener("resize",resize);

const fogs=[];
const colors = ["rgba(0,255,127,", "rgba(0,206,209,", "rgba(255,215,0,"];
for(let i=0;i<140;i++){
  fogs.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*220+120,
    dx:Math.random()*0.6-0.3,
    dy:Math.random()*0.6-0.3,
    a:Math.random()*0.1+0.03,
    color:colors[Math.floor(Math.random()*colors.length)]
  });
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const f of fogs){
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,`${f.color}${f.a})`);
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
    f.x+=f.dx; f.y+=f.dy;
    if(f.x<-300)f.x=canvas.width+300;
    if(f.x>canvas.width+300)f.x=-300;
    if(f.y<-300)f.y=canvas.height+300;
    if(f.y>canvas.height+300)f.y=-300;
  }
  requestAnimationFrame(animate);
}
animate();
</script>
